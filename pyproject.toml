[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motionbase"
dynamic = ["version"]
description = "A local, asset-driven Blender animation execution engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
motionbase = "motionbase.cli:entrypoint"

[project.urls]
Repository = "https://github.com/h-yu-u/MotionBase"

[tool.setuptools.dynamic]
version = {attr = "motionbase.__version__"}

[tool.setuptools.packages.find]
include = ["motionbase"]

[tool.setuptools.package-data]
motionbase = ["presets/*.json"]
